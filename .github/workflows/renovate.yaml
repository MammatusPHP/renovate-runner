name: Renovate

on:
  schedule:
    - cron: "0 6-22 * * 1-5"
    - cron: "0 12-23 * * 0,6"
  push:
    branches:
      - 'main'
  issues:
    types:
      - edited
  workflow_dispatch:
    inputs:
      repo:
        description: Repo to run this action for
        type: string
        required: true

concurrency:
  group: ${{ inputs.repo || 'renovate' }}
  cancel-in-progress: true

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Generate App Token for Renovate
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ secrets.RENOVATE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.repo || secrets.RENOVATE_REPOSITORIES }}
      - name: Renovate
        uses: WyriHaximus/github-action-renovatebot@152cc32b19c8cdc6b1864f136407c84f28872a1b # v0.16.15
        with:
          renovateAppToken: ${{ steps.app-token.outputs.token }}
          logLevel: debug # Enables detailed JSON logging
